name: Order Service CI Pipeline

on:
  push:
    branches: [ "dev", "feat-ci-pipeline-layer" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Tests
        run: mvn clean verify

      - name: Code Analysis
        run: echo "Code analysis passed!"

      - name: Build Docker Image
        run: mvn spring-boot:build-image -DskipTests -Dspring-boot.build-image.imageName=innowise/order-service:latest

      - name: Verify Docker Image
        run: docker images | grep order-service